<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=600, initial-scale=1" />
    <title>Urban Inversion</title>
    <style>html,body{color:#fff;background:#000;height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}#app{box-sizing:border-box;flex-direction:column;gap:18px;height:100%;padding:28px;display:flex}.status{color:#9fe8b8;align-items:center;gap:12px;font-size:22px;display:flex}.dot{background:#ff5f56;border-radius:50%;width:14px;height:14px}.dot.on{background:#27c46d}.line{flex:1;font-size:34px;font-weight:700;line-height:1.25}.dim{color:#8b8b8b;font-size:20px}.row{gap:14px;display:flex}button{color:#fff;cursor:pointer;background:#101010;border:2px solid #3a3a3a;border-radius:14px;flex:1;padding:20px 10px;font-size:22px;font-weight:600}button:focus{outline-offset:2px;outline:4px solid #27c46d}#code{letter-spacing:.18em;text-align:center;color:#27c46d;margin:8px 0;font-size:76px;font-weight:800}#pair-status{text-align:center}</style>
    <script type="module" crossorigin src="./assets/index-NerINSgS.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="gate">
        <p class="dim" id="gate-text">Pairing — enter this code in your phone's Urban Inversion app:</p>
        <div id="code">······</div>
        <p class="dim" id="pair-status"></p>
        <div class="row">
          <button id="newcode">New code</button>
        </div>
      </div>
      <div id="hud" hidden>
        <div class="status">
          <span class="dot" id="conn"></span>
          <span id="conn-text">…</span>
          <span class="dim" id="self"></span>
        </div>
        <div class="line" id="main">…</div>
        <p class="dim" id="sub"></p>
        <div class="row">
          <button id="cycle">State</button>
          <button id="audio">Audio</button>
        </div>
      </div>
    </div>
  </body>
</html>
