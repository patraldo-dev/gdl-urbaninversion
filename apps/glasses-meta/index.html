<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=600, initial-scale=1" />
    <title>Urban Inversion</title>
    <style>
      /* Additive 600×600 display: dark background, bright high-contrast
         elements. Browser-managed D-pad navigation: plain focusable
         buttons in DOM order; arrows move focus, Enter activates. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 28px;
        box-sizing: border-box;
        gap: 18px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 22px;
        color: #9fe8b8;
      }
      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ff5f56;
      }
      .dot.on {
        background: #27c46d;
      }
      .line {
        font-size: 34px;
        font-weight: 700;
        line-height: 1.25;
        flex: 1;
      }
      .dim {
        color: #8b8b8b;
        font-size: 20px;
      }
      .row {
        display: flex;
        gap: 14px;
      }
      button {
        flex: 1;
        padding: 20px 10px;
        font-size: 22px;
        font-weight: 600;
        color: #fff;
        background: #101010;
        border: 2px solid #3a3a3a;
        border-radius: 14px;
        cursor: pointer;
      }
      button:focus {
        outline: 4px solid #27c46d;
        outline-offset: 2px;
      }
      #turnstile {
        min-height: 65px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="gate">
        <p class="dim">Urban Inversion — nearby presence for your glasses.</p>
        <div id="turnstile"></div>
        <div class="row">
          <button id="start" disabled>Start</button>
        </div>
        <p id="gate-status" class="dim"></p>
      </div>
      <div id="hud" hidden>
        <div class="status">
          <span class="dot" id="conn"></span>
          <span id="conn-text">…</span>
          <span class="dim" id="self"></span>
        </div>
        <div class="line" id="main">…</div>
        <p class="dim" id="sub"></p>
        <div class="row">
          <button id="cycle">State</button>
          <button id="audio">Audio</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
