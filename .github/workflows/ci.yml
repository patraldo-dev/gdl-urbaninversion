name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --legacy-peer-deps: npm's resolver crashes on this tree otherwise.
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run check
      - run: npm test
      - run: npm run build:web
