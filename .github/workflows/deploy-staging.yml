name: Deploy — staging

# Staging deploys: push to the `staging` branch, or run manually.
# Requires repo secrets (see docs/deployment-runbook.md §11):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# TURNSTILE_SECRET is intentionally NOT in CI — set it once per environment
# with `wrangler secret put TURNSTILE_SECRET --env staging`.

on:
  workflow_dispatch:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run check
      - run: npm test
      - run: npm run build:web
      - name: Deploy presence Worker (staging)
        working-directory: workers/presence
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 migrations (staging)
        working-directory: workers/presence
        run: npx wrangler d1 migrations apply urbaninversion-presence-staging --env staging --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy web Worker (staging)
        working-directory: apps/web
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
